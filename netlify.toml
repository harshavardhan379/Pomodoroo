# Netlify hosts the frontend and the serverless session API.

[build]
  command = "echo 'No build — publishing public/'"
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sessions"
  to = "/.netlify/functions/sessions"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
