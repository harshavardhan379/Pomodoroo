# fly.io deploy config. Run `fly launch --no-deploy` to claim an app name, then:
#   fly volumes create focusblocks_data --size 1
#   fly secrets set SYNC_KEY=$(openssl rand -base64 24)
#   fly deploy
app = "focusblocks"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"

[[mounts]]
  source = "focusblocks_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
